<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>School HRM - Quản lý Chức vụ</title>
</head>
<html th:replace="~{layout/main-layout :: layout(~{::content}, ~{::scripts}, 'Quản lý Chức vụ')}">

    <div th:fragment="content">
        <!-- Action Toolbar -->
        <div class="card mb-4 border-0 shadow-sm">
            <div class="card-body d-flex justify-content-between align-items-center">
                <div class="text-muted">
                    <i class="bi bi-info-circle me-1"></i> Danh mục các vị trí, chức vụ công tác và hệ số phụ cấp tương ứng.
                </div>
                <button class="btn btn-primary" onclick="openAddPositionModal()">
                    <i class="bi bi-plus-lg me-1"></i> Thêm Chức vụ mới
                </button>
            </div>
        </div>

        <!-- Position Table Card -->
        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Mã Chức vụ</th>
                                <th>Tên Chức vụ</th>
                                <th>Hệ số / Tỷ lệ Phụ cấp</th>
                                <th class="text-end pe-4">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="position-table-body">
                            <tr>
                                <td colspan="4" class="text-center py-5 text-muted">Đang tải dữ liệu...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Add / Edit Position Modal -->
        <div class="modal fade" id="positionModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title fw-bold" id="posModalTitle">Thêm mới Chức vụ</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="positionForm">
                            <input type="hidden" id="pos-id">
                            <div class="mb-3">
                                <label class="form-label required">Mã Chức vụ *</label>
                                <input type="text" id="pos-code" class="form-control" required placeholder="VD: GV_CHINH, TRUONG_KHOA">
                            </div>
                            <div class="mb-3">
                                <label class="form-label required">Tên Chức vụ *</label>
                                <input type="text" id="pos-name" class="form-control" required placeholder="VD: Giảng viên chính">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Tỷ lệ phụ cấp chức vụ (VD: 0.25 cho 25%)</label>
                                <input type="number" step="0.01" id="pos-allowance" class="form-control" placeholder="0.00">
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                        <button type="button" class="btn btn-primary" onclick="savePosition()">Lưu thông tin</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Delete Modal -->
        <div class="modal fade" id="deletePosModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-sm modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-body text-center p-4">
                        <i class="bi bi-exclamation-triangle text-danger" style="font-size: 3rem;"></i>
                        <h5 class="mt-3">Xác nhận xóa</h5>
                        <p class="text-muted small">Bạn có chắc chắn muốn xóa chức vụ này?</p>
                        <div class="d-flex justify-content-center gap-2 mt-4">
                            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Hủy</button>
                            <button type="button" class="btn btn-danger" id="confirm-delete-pos-btn">Xóa</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:fragment="scripts">
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                loadPositions();
            });

            async function loadPositions() {
                const tbody = document.getElementById('position-table-body');
                try {
                    const res = await fetchApi('/api/v1/positions');
                    if (res && res.data) {
                        const positions = res.data;
                        if (positions.length === 0) {
                            tbody.innerHTML = '<tr><td colspan="4" class="text-center py-5 text-muted">Chưa có chức vụ nào</td></tr>';
                            return;
                        }

                        tbody.innerHTML = positions.map(pos => `
                            <tr>
                                <td><span class="badge bg-light text-primary border">${pos.code}</span></td>
                                <td class="fw-semibold text-dark">${pos.name}</td>
                                <td>
                                    <span class="badge bg-info bg-opacity-10 text-primary border border-info">
                                        ${pos.positionAllowanceRate != null ? (pos.positionAllowanceRate * 100).toFixed(1) + '%' : '0%'}
                                    </span>
                                </td>
                                <td class="text-end pe-4">
                                    <button class="btn btn-sm btn-outline-primary me-1" title="Sửa" onclick="editPosition(${pos.id})">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                    <button class="btn btn-sm btn-outline-danger" title="Xóa" onclick="confirmDeletePos(${pos.id})">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </td>
                            </tr>
                        `).join('');
                    }
                } catch (e) {
                    console.error('Error loading positions', e);
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center py-5 text-danger">Có lỗi khi tải danh sách chức vụ</td></tr>';
                }
            }

            function openAddPositionModal() {
                document.getElementById('positionForm').reset();
                document.getElementById('pos-id').value = '';
                document.getElementById('posModalTitle').textContent = 'Thêm mới Chức vụ';
                openModal('positionModal');
            }

            async function editPosition(id) {
                try {
                    const res = await fetchApi(`/api/v1/positions/${id}`);
                    if (res && res.data) {
                        const pos = res.data;
                        document.getElementById('pos-id').value = pos.id;
                        document.getElementById('pos-code').value = pos.code;
                        document.getElementById('pos-name').value = pos.name;
                        document.getElementById('pos-allowance').value = pos.positionAllowanceRate != null ? pos.positionAllowanceRate : '';
                        document.getElementById('posModalTitle').textContent = 'Chỉnh sửa Chức vụ';
                        openModal('positionModal');
                    }
                } catch (e) {
                    console.error('Error edit pos', e);
                }
            }

            async function savePosition() {
                const id = document.getElementById('pos-id').value;
                const allowanceVal = document.getElementById('pos-allowance').value;
                const payload = {
                    code: document.getElementById('pos-code').value.trim(),
                    name: document.getElementById('pos-name').value.trim(),
                    positionAllowanceRate: allowanceVal ? parseFloat(allowanceVal) : 0
                };

                if (!payload.code || !payload.name) {
                    showAlert('Vui lòng nhập Mã và Tên chức vụ', 'warning');
                    return;
                }

                try {
                    if (id) {
                        await fetchApi(`/api/v1/positions/${id}`, {
                            method: 'PUT',
                            body: JSON.stringify(payload)
                        });
                        showAlert('Cập nhật chức vụ thành công!', 'success');
                    } else {
                        await fetchApi('/api/v1/positions', {
                            method: 'POST',
                            body: JSON.stringify(payload)
                        });
                        showAlert('Thêm mới chức vụ thành công!', 'success');
                    }
                    closeModal('positionModal');
                    loadPositions();
                } catch (e) {
                    console.error('Save pos error', e);
                }
            }

            let deleteTargetPosId = null;
            function confirmDeletePos(id) {
                deleteTargetPosId = id;
                const btn = document.getElementById('confirm-delete-pos-btn');
                btn.onclick = async () => {
                    try {
                        await fetchApi(`/api/v1/positions/${deleteTargetPosId}`, { method: 'DELETE' });
                        showAlert('Đã xóa chức vụ!', 'success');
                        closeModal('deletePosModal');
                        loadPositions();
                    } catch (e) {
                        console.error('Delete pos error', e);
                    }
                };
                openModal('deletePosModal');
            }
        </script>
    </div>
</body>
</html>

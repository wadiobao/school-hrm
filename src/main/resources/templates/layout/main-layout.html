<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content, scripts, pageTitle)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} ? ${title} : 'School HRM'">School HRM</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse p-0">
                <div class="position-sticky pt-0">
                    <div class="brand-wrapper d-flex align-items-center mb-2">
                        <i class="bi bi-mortarboard-fill text-primary fs-3 me-2"></i>
                        <div>
                            <h5 class="m-0">School HRM</h5>
                            <small class="text-white-50" style="font-size: 0.72rem;">Hệ thống Quản lý Nhân sự</small>
                        </div>
                    </div>
                    <ul class="nav flex-column mb-auto">
                        <li class="nav-item">
                            <a class="nav-link" th:classappend="${pageTitle == 'Dashboard'} ? 'active' : ''" href="/">
                                <i class="bi bi-grid-1x2-fill"></i> Tổng quan
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:classappend="${pageTitle == 'Quản lý Nhân viên'} ? 'active' : ''" href="/employees">
                                <i class="bi bi-people-fill"></i> Nhân viên
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:classappend="${pageTitle == 'Quản lý Phòng ban'} ? 'active' : ''" href="/departments">
                                <i class="bi bi-building"></i> Phòng ban / Khoa
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:classappend="${pageTitle == 'Quản lý Chức vụ'} ? 'active' : ''" href="/positions">
                                <i class="bi bi-award-fill"></i> Chức vụ
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:classappend="${pageTitle == 'Quản lý Chấm công'} ? 'active' : ''" href="/attendance">
                                <i class="bi bi-calendar-check-fill"></i> Chấm công
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:classappend="${pageTitle == 'Quản lý Nghỉ phép'} ? 'active' : ''" href="/leaves">
                                <i class="bi bi-calendar2-week-fill"></i> Nghỉ phép
                            </a>
                        </li>
                    </ul>

                    <div class="p-3 mt-4">
                        <div class="card bg-dark bg-opacity-25 border-0 text-white-50 p-2 text-center" style="font-size: 0.78rem;">
                            <span>School HRM v1.0</span>
                        </div>
                    </div>
                </div>
            </nav>

            <!-- Main Content Area -->
            <main class="col-md-9 ms-sm-auto col-lg-10 p-0">
                <!-- Topbar -->
                <div class="top-navbar px-4 py-3 d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center">
                        <button class="btn btn-sm btn-outline-secondary d-md-none me-2" type="button" data-bs-toggle="collapse" data-bs-target=".sidebar">
                            <i class="bi bi-list"></i>
                        </button>
                        <h4 class="m-0 fw-bold text-dark" th:text="${pageTitle} ? ${pageTitle} : 'Dashboard'">Dashboard</h4>
                    </div>
                    <div class="d-flex align-items-center gap-3">
                        <div class="d-flex align-items-center">
                            <div class="avatar-circle me-2">AD</div>
                            <div class="d-none d-sm-block text-start">
                                <div class="fw-semibold small">Ban Giám Hiệu / Admin</div>
                                <div class="text-muted" style="font-size: 0.72rem;">admin@school.edu.vn</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="content-wrapper">
                    <!-- Notification Alert Container -->
                    <div id="alert-container"></div>

                    <!-- Injected Page Content -->
                    <div th:replace="${content}"></div>
                </div>
            </main>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom Application JS -->
    <script src="/js/app.js"></script>
    <!-- Page Specific Injected Scripts -->
    <div th:replace="${scripts}"></div>
</body>
</html>

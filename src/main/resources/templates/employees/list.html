<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>School HRM - Danh sách Nhân viên</title>
</head>
<body th:replace="~{layout/main-layout :: layout(~{::content}, ~{::scripts}, 'Quản lý Nhân viên')}">

    <div th:fragment="content">
        <div class="card mb-4">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span>Danh sách Nhân viên</span>
                <button class="btn btn-sm btn-primary" onclick="alert('Tính năng thêm đang phát triển')">
                    <i class="bi bi-plus-circle"></i> Thêm mới
                </button>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>Mã NV</th>
                                <th>Họ tên</th>
                                <th>Email</th>
                                <th>Số điện thoại</th>
                                <th>Phòng ban</th>
                                <th>Vị trí</th>
                                <th>Trạng thái</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="employee-table-body">
                            <tr>
                                <td colspan="8" class="text-center">Đang tải dữ liệu...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <!-- Pagination can be added here -->
            </div>
        </div>
    </div>

    <div th:fragment="scripts">
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                loadEmployees();
            });

            async function loadEmployees() {
                const tbody = document.getElementById('employee-table-body');
                try {
                    const response = await fetchApi('/api/v1/employees?size=50');
                    if (response && response.data && response.data.content) {
                        const employees = response.data.content;
                        
                        if (employees.length === 0) {
                            tbody.innerHTML = '<tr><td colspan="8" class="text-center">Không có dữ liệu</td></tr>';
                            return;
                        }

                        tbody.innerHTML = employees.map(emp => `
                            <tr>
                                <td>${emp.employeeCode || 'N/A'}</td>
                                <td>${emp.fullName || 'N/A'}</td>
                                <td>${emp.email || 'N/A'}</td>
                                <td>${emp.phone || 'N/A'}</td>
                                <td>${emp.departmentName || 'N/A'}</td>
                                <td>${emp.positionName || 'N/A'}</td>
                                <td><span class="badge bg-info">${emp.status || 'ACTIVE'}</span></td>
                                <td>
                                    <button class="btn btn-sm btn-outline-primary" onclick="alert('Chức năng sửa ${emp.employeeCode}')"><i class="bi bi-pencil"></i></button>
                                    <button class="btn btn-sm btn-outline-danger" onclick="alert('Chức năng xóa ${emp.employeeCode}')"><i class="bi bi-trash"></i></button>
                                </td>
                            </tr>
                        `).join('');
                    }
                } catch (error) {
                    console.error('Lỗi lấy danh sách nhân viên', error);
                    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-danger">Lỗi tải dữ liệu</td></tr>';
                }
            }
        </script>
    </div>
</body>
</html>

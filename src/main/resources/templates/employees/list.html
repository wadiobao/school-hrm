<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>School HRM - Quản lý Nhân viên</title>
</head>
<html th:replace="~{layout/main-layout :: layout(~{::content}, ~{::scripts}, 'Quản lý Nhân viên')}">

    <div th:fragment="content">
        <!-- Filter & Search Toolbar -->
        <div class="card mb-4 border-0 shadow-sm">
            <div class="card-body">
                <div class="row g-3 align-items-center">
                    <div class="col-md-5">
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                            <input type="text" id="filter-keyword" class="form-control border-start-0 ps-0" 
                                   placeholder="Tìm theo Mã NV, Tên hoặc Email..." onkeyup="if(event.key==='Enter') applyFilters()">
                        </div>
                    </div>
                    <div class="col-md-4">
                        <select id="filter-department" class="form-select" onchange="applyFilters()">
                            <option value="">-- Tất cả Phòng ban / Khoa --</option>
                        </select>
                    </div>
                    <div class="col-md-3 d-flex justify-content-end gap-2">
                        <button class="btn btn-outline-secondary" onclick="resetFilters()">
                            <i class="bi bi-arrow-counterclockwise"></i> Đặt lại
                        </button>
                        <button class="btn btn-primary" onclick="openAddEmployeeModal()">
                            <i class="bi bi-plus-lg me-1"></i> Thêm Nhân viên
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Employee Table Card -->
        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Nhân viên</th>
                                <th>Mã NV</th>
                                <th>Liên hệ</th>
                                <th>Phòng ban</th>
                                <th>Chức vụ</th>
                                <th>Trạng thái</th>
                                <th class="text-end pe-4">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="employee-table-body">
                            <tr>
                                <td colspan="7" class="text-center py-5 text-muted">Đang tải dữ liệu...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div class="p-3 border-top d-flex justify-content-between align-items-center">
                    <div class="text-muted small" id="pagination-info">Hiển thị 0 kết quả</div>
                    <nav>
                        <ul class="pagination pagination-sm mb-0" id="pagination-nav"></ul>
                    </nav>
                </div>
            </div>
        </div>

        <!-- Add / Edit Employee Modal -->
        <div class="modal fade" id="employeeModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-lg modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title fw-bold" id="employeeModalTitle">Thêm mới Nhân viên</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="employeeForm">
                            <input type="hidden" id="emp-id">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label required">Mã Nhân Viên *</label>
                                    <input type="text" id="emp-code" class="form-control" required placeholder="VD: NV001">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label required">Họ và Tên *</label>
                                    <input type="text" id="emp-fullname" class="form-control" required placeholder="Nguyễn Văn A">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label required">Email Cơ quan *</label>
                                    <input type="email" id="emp-email" class="form-control" required placeholder="nv@school.edu.vn">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Số điện thoại</label>
                                    <input type="text" id="emp-phone" class="form-control" placeholder="0901234567">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label required">Căn cước công dân (CCCD) *</label>
                                    <input type="text" id="emp-citizenId" class="form-control" required placeholder="12 chữ số">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Ngày sinh</label>
                                    <input type="date" id="emp-dob" class="form-control">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Giới tính</label>
                                    <select id="emp-gender" class="form-select">
                                        <option value="NAM">Nam</option>
                                        <option value="NU">Nữ</option>
                                        <option value="KHAC">Khác</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label required">Phòng ban / Khoa *</label>
                                    <select id="emp-departmentId" class="form-select" required>
                                        <option value="">-- Chọn phòng ban --</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label required">Chức vụ *</label>
                                    <select id="emp-positionId" class="form-select" required>
                                        <option value="">-- Chọn chức vụ --</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Ngày tiếp nhận</label>
                                    <input type="date" id="emp-joinDate" class="form-control">
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Địa chỉ liên hệ</label>
                                    <input type="text" id="emp-address" class="form-control" placeholder="Số nhà, đường, quận/huyện, tỉnh/TP">
                                </div>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                        <button type="button" class="btn btn-primary" onclick="saveEmployee()">Lưu thông tin</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Detail Employee Modal -->
        <div class="modal fade" id="detailModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title fw-bold">Chi tiết Hồ sơ Nhân viên</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body" id="detail-modal-body">
                        <!-- Filled by JS -->
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Delete Confirmation Modal -->
        <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-sm modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-body text-center p-4">
                        <i class="bi bi-exclamation-triangle text-danger" style="font-size: 3rem;"></i>
                        <h5 class="mt-3">Xác nhận xóa</h5>
                        <p class="text-muted small">Hành động này không thể hoàn tác. Bạn có chắc chắn muốn xóa nhân viên này?</p>
                        <div class="d-flex justify-content-center gap-2 mt-4">
                            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Hủy</button>
                            <button type="button" class="btn btn-danger" id="confirm-delete-btn">Xóa vĩnh viễn</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:fragment="scripts">
        <script>
            let currentPage = 0;
            const pageSize = 10;
            let currentKeyword = '';
            let currentDeptId = '';
            let departmentsList = [];
            let positionsList = [];

            document.addEventListener('DOMContentLoaded', async () => {
                await loadMetaOptions();
                loadEmployees();
            });

            async function loadMetaOptions() {
                try {
                    const [deptRes, posRes] = await Promise.all([
                        fetchApi('/api/v1/departments'),
                        fetchApi('/api/v1/positions')
                    ]);

                    if (deptRes && deptRes.data) {
                        departmentsList = deptRes.data;
                        const filterSelect = document.getElementById('filter-department');
                        const empDeptSelect = document.getElementById('emp-departmentId');
                        
                        departmentsList.forEach(d => {
                            filterSelect.innerHTML += `<option value="${d.id}">${d.name} (${d.code})</option>`;
                            empDeptSelect.innerHTML += `<option value="${d.id}">${d.name}</option>`;
                        });
                    }

                    if (posRes && posRes.data) {
                        positionsList = posRes.data;
                        const empPosSelect = document.getElementById('emp-positionId');
                        positionsList.forEach(p => {
                            empPosSelect.innerHTML += `<option value="${p.id}">${p.name}</option>`;
                        });
                    }
                } catch (e) {
                    console.error('Error loading metadata', e);
                }
            }

            async function loadEmployees(page = 0) {
                currentPage = page;
                const tbody = document.getElementById('employee-table-body');
                tbody.innerHTML = '<tr><td colspan="7" class="text-center py-5 text-muted">Đang tải dữ liệu...</td></tr>';

                let url = `/api/v1/employees?page=${currentPage}&size=${pageSize}`;
                if (currentKeyword) url += `&keyword=${encodeURIComponent(currentKeyword)}`;
                if (currentDeptId) url += `&departmentId=${currentDeptId}`;

                try {
                    const response = await fetchApi(url);
                    if (response && response.data) {
                        const pageData = response.data;
                        const employees = pageData.content || [];

                        if (employees.length === 0) {
                            tbody.innerHTML = '<tr><td colspan="7" class="text-center py-5 text-muted">Không tìm thấy nhân viên nào phù hợp</td></tr>';
                            document.getElementById('pagination-info').textContent = 'Hiển thị 0 kết quả';
                            document.getElementById('pagination-nav').innerHTML = '';
                            return;
                        }

                        tbody.innerHTML = employees.map(emp => {
                            const initials = (emp.fullName || 'NV').split(' ').map(n => n[0]).slice(-2).join('').toUpperCase();
                            const statusBadge = emp.status === 'PROBATION' ? '<span class="badge bg-warning text-dark">Thử việc</span>' :
                                                emp.status === 'RESIGNED' ? '<span class="badge bg-danger">Đã nghỉ việc</span>' :
                                                '<span class="badge bg-success">Đang làm việc</span>';

                            return `
                                <tr>
                                    <td>
                                        <div class="d-flex align-items-center">
                                            <div class="avatar-circle me-3">${initials}</div>
                                            <div>
                                                <div class="fw-bold">${emp.fullName || 'N/A'}</div>
                                                <small class="text-muted">${emp.gender || ''}</small>
                                            </div>
                                        </div>
                                    </td>
                                    <td><span class="badge bg-light text-primary border">${emp.employeeCode || 'N/A'}</span></td>
                                    <td>
                                        <div><i class="bi bi-envelope me-1 text-muted"></i>${emp.email || 'N/A'}</div>
                                        <small class="text-muted"><i class="bi bi-telephone me-1"></i>${emp.phone || 'N/A'}</small>
                                    </td>
                                    <td>${emp.departmentName || '<span class="text-muted">Chưa gán</span>'}</td>
                                    <td>${emp.positionName || '<span class="text-muted">Chưa gán</span>'}</td>
                                    <td>${statusBadge}</td>
                                    <td class="text-end pe-4">
                                        <div class="btn-group">
                                            <button class="btn btn-sm btn-outline-info" title="Xem chi tiết" onclick="viewEmployeeDetail(${emp.id})">
                                                <i class="bi bi-eye"></i>
                                            </button>
                                            <button class="btn btn-sm btn-outline-primary" title="Chỉnh sửa" onclick="editEmployee(${emp.id})">
                                                <i class="bi bi-pencil"></i>
                                            </button>
                                            <button class="btn btn-sm btn-outline-danger" title="Xóa" onclick="confirmDeleteEmployee(${emp.id})">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            `;
                        }).join('');

                        // Pagination Render
                        renderPagination(pageData);
                    }
                } catch (e) {
                    console.error('Error loading employees', e);
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center py-5 text-danger">Có lỗi xảy ra khi tải dữ liệu</td></tr>';
                }
            }

            function renderPagination(pageData) {
                const totalPages = pageData.totalPages || 1;
                const totalElements = pageData.totalElements || 0;
                document.getElementById('pagination-info').textContent = `Trang ${currentPage + 1}/${totalPages} (Tổng ${totalElements} nhân viên)`;

                const nav = document.getElementById('pagination-nav');
                let html = '';

                html += `<li class="page-item ${currentPage === 0 ? 'disabled' : ''}">
                            <a class="page-link" href="javascript:void(0)" onclick="loadEmployees(${currentPage - 1})">Trước</a>
                         </li>`;

                for (let i = 0; i < totalPages; i++) {
                    if (i === 0 || i === totalPages - 1 || (i >= currentPage - 1 && i <= currentPage + 1)) {
                        html += `<li class="page-item ${i === currentPage ? 'active' : ''}">
                                    <a class="page-link" href="javascript:void(0)" onclick="loadEmployees(${i})">${i + 1}</a>
                                 </li>`;
                    }
                }

                html += `<li class="page-item ${currentPage >= totalPages - 1 ? 'disabled' : ''}">
                            <a class="page-link" href="javascript:void(0)" onclick="loadEmployees(${currentPage + 1})">Sau</a>
                         </li>`;

                nav.innerHTML = html;
            }

            function applyFilters() {
                currentKeyword = document.getElementById('filter-keyword').value.trim();
                currentDeptId = document.getElementById('filter-department').value;
                loadEmployees(0);
            }

            function resetFilters() {
                document.getElementById('filter-keyword').value = '';
                document.getElementById('filter-department').value = '';
                currentKeyword = '';
                currentDeptId = '';
                loadEmployees(0);
            }

            function openAddEmployeeModal() {
                document.getElementById('employeeForm').reset();
                document.getElementById('emp-id').value = '';
                document.getElementById('employeeModalTitle').textContent = 'Thêm mới Nhân viên';
                openModal('employeeModal');
            }

            async function editEmployee(id) {
                try {
                    const res = await fetchApi(`/api/v1/employees/${id}`);
                    if (res && res.data) {
                        const emp = res.data;
                        document.getElementById('emp-id').value = emp.id;
                        document.getElementById('emp-code').value = emp.employeeCode || '';
                        document.getElementById('emp-fullname').value = emp.fullName || '';
                        document.getElementById('emp-email').value = emp.email || '';
                        document.getElementById('emp-phone').value = emp.phone || '';
                        document.getElementById('emp-citizenId').value = emp.citizenId || '';
                        document.getElementById('emp-dob').value = emp.dateOfBirth || '';
                        document.getElementById('emp-gender').value = emp.gender || 'NAM';
                        document.getElementById('emp-departmentId').value = emp.departmentId || '';
                        document.getElementById('emp-positionId').value = emp.positionId || '';
                        document.getElementById('emp-joinDate').value = emp.joinDate || '';
                        document.getElementById('emp-address').value = emp.address || '';

                        document.getElementById('employeeModalTitle').textContent = 'Chỉnh sửa Nhân viên';
                        openModal('employeeModal');
                    }
                } catch (e) {
                    console.error('Error fetching employee', e);
                }
            }

            async function saveEmployee() {
                const id = document.getElementById('emp-id').value;
                const payload = {
                    employeeCode: document.getElementById('emp-code').value.trim(),
                    fullName: document.getElementById('emp-fullname').value.trim(),
                    email: document.getElementById('emp-email').value.trim(),
                    phone: document.getElementById('emp-phone').value.trim(),
                    citizenId: document.getElementById('emp-citizenId').value.trim(),
                    dateOfBirth: document.getElementById('emp-dob').value || null,
                    gender: document.getElementById('emp-gender').value,
                    departmentId: document.getElementById('emp-departmentId').value ? parseInt(document.getElementById('emp-departmentId').value) : null,
                    positionId: document.getElementById('emp-positionId').value ? parseInt(document.getElementById('emp-positionId').value) : null,
                    joinDate: document.getElementById('emp-joinDate').value || null,
                    address: document.getElementById('emp-address').value.trim()
                };

                if (!payload.employeeCode || !payload.fullName || !payload.email || !payload.citizenId || !payload.departmentId || !payload.positionId) {
                    showAlert('Vui lòng điền đầy đủ các trường bắt buộc (*)', 'warning');
                    return;
                }

                try {
                    if (id) {
                        await fetchApi(`/api/v1/employees/${id}`, {
                            method: 'PUT',
                            body: JSON.stringify(payload)
                        });
                        showAlert('Cập nhật nhân viên thành công!', 'success');
                    } else {
                        await fetchApi('/api/v1/employees', {
                            method: 'POST',
                            body: JSON.stringify(payload)
                        });
                        showAlert('Thêm mới nhân viên thành công!', 'success');
                    }
                    closeModal('employeeModal');
                    loadEmployees(currentPage);
                } catch (e) {
                    console.error('Save employee error', e);
                }
            }

            async function viewEmployeeDetail(id) {
                try {
                    const res = await fetchApi(`/api/v1/employees/${id}`);
                    if (res && res.data) {
                        const emp = res.data;
                        const body = document.getElementById('detail-modal-body');
                        body.innerHTML = `
                            <div class="text-center mb-4">
                                <div class="avatar-circle mx-auto mb-2" style="width: 64px; height: 64px; font-size: 1.5rem;">
                                    ${(emp.fullName || 'NV').slice(0, 2).toUpperCase()}
                                </div>
                                <h5 class="fw-bold m-0">${emp.fullName || 'N/A'}</h5>
                                <div class="text-muted small">${emp.employeeCode} - ${emp.positionName || 'Chưa có chức danh'}</div>
                            </div>
                            <ul class="list-group list-group-flush small">
                                <li class="list-group-item d-flex justify-content-between">
                                    <span class="text-muted">Phòng ban/Khoa:</span>
                                    <span class="fw-semibold">${emp.departmentName || 'Chưa phân bổ'}</span>
                                </li>
                                <li class="list-group-item d-flex justify-content-between">
                                    <span class="text-muted">Email:</span>
                                    <span class="fw-semibold">${emp.email || 'N/A'}</span>
                                </li>
                                <li class="list-group-item d-flex justify-content-between">
                                    <span class="text-muted">Điện thoại:</span>
                                    <span class="fw-semibold">${emp.phone || 'N/A'}</span>
                                </li>
                                <li class="list-group-item d-flex justify-content-between">
                                    <span class="text-muted">CCCD:</span>
                                    <span class="fw-semibold">${emp.citizenId || 'N/A'}</span>
                                </li>
                                <li class="list-group-item d-flex justify-content-between">
                                    <span class="text-muted">Ngày sinh:</span>
                                    <span class="fw-semibold">${formatDate(emp.dateOfBirth)}</span>
                                </li>
                                <li class="list-group-item d-flex justify-content-between">
                                    <span class="text-muted">Ngày gia nhập:</span>
                                    <span class="fw-semibold">${formatDate(emp.joinDate)}</span>
                                </li>
                                <li class="list-group-item d-flex justify-content-between">
                                    <span class="text-muted">Địa chỉ:</span>
                                    <span class="fw-semibold text-end">${emp.address || 'N/A'}</span>
                                </li>
                            </ul>
                        `;
                        openModal('detailModal');
                    }
                } catch (e) {
                    console.error('Error detail', e);
                }
            }

            let deleteTargetId = null;
            function confirmDeleteEmployee(id) {
                deleteTargetId = id;
                const btn = document.getElementById('confirm-delete-btn');
                btn.onclick = async () => {
                    try {
                        await fetchApi(`/api/v1/employees/${deleteTargetId}`, { method: 'DELETE' });
                        showAlert('Đã xóa nhân viên thành công!', 'success');
                        closeModal('deleteModal');
                        loadEmployees(currentPage);
                    } catch (e) {
                        console.error('Delete error', e);
                    }
                };
                openModal('deleteModal');
            }
        </script>
    </div>
</body>
</html>
